[package]
name = "flappy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# A cart is a cdylib: the simulator instantiates it and calls its `start` and
# `update` exports.
crate-type = ["cdylib"]

[dependencies]
sycl-cart = { path = "../../sycl-cart", features = ["log-info"] }
