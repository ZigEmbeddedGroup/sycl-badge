[package]
name = "itest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
# A cart is a bin with no `main`: the simulator instantiates the wasm module and
# calls its `start` and `update` exports, and on the badge the OS jumps to the
# `_start` that `sycl_cart::cart!` emits, which loops over the same two.
name = "itest"
path = "src/main.rs"

[dependencies]
sycl-cart = { path = "../../sycl-cart", features = ["log-info"] }
